name: Lakehouse IaC & Governance CI

on:
  push:
    branches:
      - main
    paths:
      - 'lakehouse/**'
      - '.github/workflows/lakehouse-ci.yml'
      - 'docs/SCHEMA.md'
      - 'ROADMAP.md'
  pull_request:
    branches:
      - main
    paths:
      - 'lakehouse/**'
      - '.github/workflows/lakehouse-ci.yml'
      - 'docs/SCHEMA.md'
      - 'ROADMAP.md'
  workflow_dispatch:

jobs:
  validate-iac:
    name: Validate Terraform & Databricks Asset Bundles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Check Terraform Formatting
        run: terraform -chdir=lakehouse/terraform fmt -check

      - name: Initialize Terraform (No Backend)
        run: terraform -chdir=lakehouse/terraform init -backend=false

      - name: Validate Terraform Configuration
        run: terraform -chdir=lakehouse/terraform validate

      - name: Setup Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Validate Databricks Asset Bundle (Dev)
        run: |
          databricks bundle validate --bundle-dir lakehouse -t dev

      - name: Validate Databricks Asset Bundle (Prod)
        run: |
          databricks bundle validate --bundle-dir lakehouse -t prod

  lakehouse-tests:
    name: Run Lakehouse Tests & Claims Linter Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Lakehouse Unit & Integration Tests
        run: |
          python3 -m unittest discover -s lakehouse/tests -v

      - name: Execute Claims & Invariant Linter Gate
        run: |
          python3 lakehouse/scripts/audit_claims.py

      - name: Generate Lakehouse CycloneDX SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements lakehouse/requirements.txt -o lakehouse/bom.json

      - name: Upload Lakehouse SBOM Artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-lakehouse-cyclonedx
          path: lakehouse/bom.json
