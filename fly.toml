# fly.toml app configuration file generated for GradCast
# See https://fly.io/docs/reference/configuration/ for options

app = 'gradcast'
primary_region = 'dfw'

[build]
  dockerfile = 'Dockerfile'

[env]
  ASPNETCORE_URLS = 'http://+:5062'
  ASPNETCORE_ENVIRONMENT = 'Production'
  DatabasePath = '/app/data/gradcast.db'
  DataSource = 'hybrid'

[http_service]
  internal_port = 5062
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  # Kept warm (min 1 machine) for launch; reduce to 0 later to sleep when idle
  min_machines_count = 1

[[http_service.checks]]
  interval = '30s'
  timeout = '5s'
  grace_period = '15s'
  method = 'GET'
  path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

[mounts]
  source = 'gradcast_data'
  destination = '/app/data'
  initial_size = '1gb'
